name: Token3 Image

on:
  push:
    branches:
      - token3-restricted-admin
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/carminback/sub2api:token3-restricted-admin
            ghcr.io/carminback/sub2api:sha-${{ github.sha }}
          build-args: |
            VERSION=0.1.170-token3.2
            COMMIT=${{ github.sha }}
